# DE25-Standard (Agilex 5 SoC) minimal HPS + heartbeat-LED smoke.
#
# The first-milestone landing for the Agilex 5 HPS platform/preset (RTL-P3.682):
# bring up the HPS subsystem with the smallest possible fabric and a heartbeat
# LED (BENCH_RUNBOOK CHILD-2 step-1/2 interim contract). The full DDR-validator
# datapath is the sibling example de25_agilex5_ddr_validator; this one isolates
# the HPS platform generation itself.
#
# Pure-rr discipline: this descriptor is DECLARATIVE only. The Agilex 5 HPS is a
# VENDOR IP — declared in ip.yml by name/type. `rr` OWNS its qsys generation
# (sdk/engine/hps_preset.py renders the qsys-script + runs qsys-generate to emit
# the hps-handoff). There is NO hand-authored gen_bd.tcl / qsys-script here, and
# no hand-curated sources list — autodiscovery walks src/.
#
# The vendor Linux DEFAULTS (first_stage: uboot-spl, u-boot-socfpga +
# linux-socfpga, ATF BL31, hardware_handoff: hps-handoff) come from the `altera`
# SocLinuxProfile in the RTL-P3.684 SoC seam (sdk/engine/soc_backend.py), so we
# don't duplicate them. That profile is implemented=False / ticket=RTL-P3.681;
# this milestone delivers the HPS PLATFORM (RTL-P3.682), not the Linux boot
# backend (RTL-P3.681) — `rr linux` still raises SocBackendNotImplementedError.

project:
  name: de25_hps_smoke
  top_module: top_de25_hps_smoke

auto_sources: true

hardware:
  vendor: altera
  part: "A5ED013BB32AE4SCS"
  language: vhdl
  platform: de25-standard       # boards/de25-standard pinout (HPS_LED Y127, CLOCK2_50 BM71)
  edition: pro
  tool_path: /opt/altera_pro/25.3

build_options:
  tool_version: "25.3"

paths:
  sources:
    - src

# NOTE: the HPS subsystem's synthesis IP sources are NOT hand-listed here. `rr
# synth run` renders the qsys-script + runs qsys-generate (sdk/engine/
# hps_preset.py) BEFORE synthesis, then OWNS registering every generated
# synthesis .qip (the top hps_subsys.qip + the per-child qips under ip/hps_subsys/
# — the HPS hard IP, f2sdram adapter, fabric clock/reset bridges, led PIO, Reset
# Release IP) into the project's IP_FILES (RTL-P3.682d, sdk/engine/hps_gen.py).
# Hand-listing those generated child paths would be a curated generated-source
# list — the anti-pattern the pure-rr discipline forbids. The descriptor only
# names the HPS system (ip.yml); rr resolves its generated synthesis sources.

linting:
  profile: esa-vhdl-baseline-provisional

# The HPS subsystem + fabric IPs are declared in ip.yml (sibling file) and
# generated by rr. project.yml only declares the build; ip.yml declares the
# vendor IPs to generate. See ip.yml.

memory_map: sw/linux/system_memory_map.yml
