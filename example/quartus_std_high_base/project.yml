# DDR-P3.39 remainder — Quartus Prime Standard 23.1 synth smoke of the
# fixed-width ddr_base_addr_g vector at x"80000000".
#
# The IP top ddr_stream_avmm already takes std_logic_vector(31 downto 0).
# This scratch project is a *consumer* that maps the unsigned upper-half
# address in VHDL so Quartus 23.1 Std never sees an INTEGER 2147483648.
#
# Run from the rr-ddr-stream repo root (paths below are repo-relative):
#   RR_EDA_TOOLS=<bench runtimes/tools.yml> \
#     rr synth run --target quartus_std_high_base --wait
#
# Part: Arria 10 GX 10AX115S2F45I1SG — Std 23.1 supports it; Pro also can,
# so toolchain.tool pins the Standard install. IP-only elaboration (no
# pins, no SDC, no bitstream).

project:
  name: rr_ddr_stream_quartus_std_high_base
  top_module: ddr_stream_avmm_high_base
  output_dir: out/quartus_std_high_base

hardware:
  vendor: altera
  part: "10AX115S2F45I1SG"
  language: vhdl
  platform: default
  edition: std

build_options:
  tool_version: "23.1std"
  generics:
    user_data_width_g: 32
    ddr_data_width_g:  512

toolchain:
  tool: quartus-std-23.1

# Sources come from the resolver (DDR-P3.46): it walks paths.sources from the
# wrapper top and, for vendor altera, selects the GHDL/Quartus-safe Intel
# rr_fifo_*_xpm_body_stub bodies, never the `library xpm` Xilinx ones. The olo
# primitives are declared as packages so the lock attributes them to library olo.
# Queue job 82e899003d6c (2026-10-20, 23.1std.0): 30 VHDL_FILE entries, 18 rr +
# 12 olo + 0 work; map.rpt ddr_base_addr_g = x"80000000"; 0 errors.
packages:
  open-logic/olo_base_fifo_sync: ^4.4.1
  open-logic/olo_base_fifo_async: ^4.4.1
  open-logic/olo_base_wconv_n2xn: ^4.4.1
  open-logic/olo_base_wconv_xn2n: ^4.4.1

paths:
  sources:
    - rtl
    - libs
    - example/quartus_std_high_base/src
