# Vendor-IP manifest for the AXE5-Eagle fabric LPDDR4 validator.
#
# rr generates the Agilex 5 HPS subsystem from this declaration before
# synthesis (rr synth run): it renders a qsys-script, runs qsys-generate, and
# adds the generated hps_subsys to the Quartus project. No hand-written Qsys
# system or generator script is involved.
#
# The design uses the HPS for three things only:
#   - the fabric clock and reset release (fabric_clk / ninit_done),
#   - the lightweight HPS-to-FPGA AXI master (lwh2f), which Linux uses to reach
#     the validator CSR block,
#   - its own LPDDR4 controller, which the HPS needs to boot Linux.
# The memory under test is the separate FABRIC LPDDR4 device. Its controller
# (emif_bank2a_fpga) sits in the fabric and is not part of hps_subsys, so the
# FPGA-to-SDRAM bridge is held idle.

platform:
  hps:
    system: hps_subsys
    vendor: altera

ips:
  - name: hps
    type: intel_agilex_5_soc
    vendor: altera
    config:
      # Board facts, not generated by rr: the frozen HPS component
      # (ip/agilex_hps/agilex_hps.ip, IO48 pin-mux for the AXE5-Eagle) and the
      # HPS LPDDR4 controller (ip/emif_io96b_hps/emif_io96b_hps.ip). Both come
      # from the board vendor's golden hardware reference design; see README.md.
      hps_frozen: true
      hps_emif: true
      h2f_width: 0
      lwh2f_width: 32
      enable_lwh2f: true
      export_lwh2f: true
      # The frozen HPS component carries the FPGA-to-SDRAM bridge enabled, and
      # Platform Designer refuses an enabled bridge with no clock. It is
      # exported and the top ties it idle: no transaction ever reaches HPS DDR.
      enable_f2sdram: true
      export_f2sdram: true
      f2sdram_width: 256
      f2s_width: 0
