# Arrow AXE5-Eagle (Agilex 5 E-Series SoC) fabric LPDDR4 validator.
#
# Runs ddr_stream_axi against the board's fabric LPDDR4 device (1 GB, 256-bit
# AXI4 controller emif_bank2a_fpga). A self-checking BIST in the fabric writes
# a pattern through the IP and reads it back; Linux on the HPS starts a run
# and reads the verdict through the lightweight HPS-to-FPGA bridge. See
# README.md for the build and run procedure.
#
# Build inputs, all inside this directory:
#   ip.yml                      HPS subsystem declaration; rr generates
#                               hps_subsys from it before synthesis.
#   ip/agilex_hps, ip/emif_io96b_hps
#                               HPS board facts used by that generation.
#   ip/emif_a5/.../emif_bank2a_fpga.ip
#                               fabric LPDDR4 controller, generated by the
#                               pre_build hook below.
#   tcl/project_options.tcl     pin assignments and the fabric controller .qip.

project:
  name: rr_ddr_stream_axe5_eagle_lpddr4_validator
  top_module: top_axe5_eagle_lpddr4_validator
auto_sources: true

hardware:
  vendor: altera
  part: "A5ED065BB32AE4SR0"
  family: "Agilex 5"
  language: vhdl
  platform: axe5-eagle
  edition: pro
  # Quartus Prime Pro 26.1 is found by auto-discovery. On a host with several
  # installs, pin the install root in a target yml (hardware.tool_path) rather
  # than in this file.
  tool_version: "26.1"

packages:
  open-logic/olo_base_fifo_sync:  {version: ^4.4.1, library: olo}
  open-logic/olo_base_fifo_async: {version: ^4.4.1, library: olo}
  open-logic/olo_base_wconv_n2xn: {version: ^4.4.1, library: olo}
  open-logic/olo_base_wconv_xn2n: {version: ^4.4.1, library: olo}

linting:
  profile: esa-vhdl-baseline-provisional

hooks:
  pre_build:
    - name: "Generate the fabric LPDDR4 controller (emif_bank2a_fpga)"
      script: scripts/generate_fabric_emif.py
      inputs:
        - ip/emif_a5/golden_ghrd/emif_subsystem/emif_bank2a_fpga.ip
      expected_outputs:
        - ip/emif_a5/golden_ghrd/emif_subsystem/emif_bank2a_fpga/emif_bank2a_fpga.qip

tcl_hooks:
  synthesis:
    - tcl/project_options.tcl
  implementation:
    - tcl/project_options.tcl
  bitstream:
    - tcl/project_options.tcl

linux:
  board: axe5-eagle
  # Release the HPS-to-FPGA bridges in the generated boot command, so Linux
  # can reach the CSR block at 0x20000000.
  hps_fpga_bridges: all
  sdcard:
    # The SOF configures the fabric before the HPS boots; U-Boot does not
    # load a core .rbf.
    config_order: fpga-first
  # Console on HPS UART0 (0x10c02000), the UART wired to the board's serial
  # header.
  bootargs: "console=ttyS0,115200 earlycon=uart8250,mmio32,0x10c02000,115200n8 root=/dev/ram0 rw init=/sbin/init ramdisk_size=10000000 panic=-1 nosmp kvm-arm.mode=nvhe"
  apps:
    - name: ddr_validator
      source: sw/linux/ddr_validator.c
      install: /usr/bin/ddr_validator

memory_map: sw/linux/system_memory_map.yml

# The IP under test is this repository's own rtl/ (library rr, placed by the
# source resolver); `rr pkg install` puts the open-logic packages in libs/.
paths:
  sources: [src, ../../rtl, libs]
