# DDR-P2.18 REA: trigger on the first returned DDR beat.
type: rea
sample_width: 160
depth: 4096
sample_clock_hz: 100000000
jtag_chain: 1
jtag_tap: mpfs.cpu
probes:
  - { signal: read_data,       width: 32 }
  - { signal: write_data,      width: 32 }
  - { signal: wr_commit_addr,  width: 32 }
  - { signal: words_read,      width: 16 }
  - { signal: words_written,   width: 16 }
  - { signal: m_axis_valid,    width: 1 }
  - { signal: m_axis_ready,    width: 1 }
  - { signal: bist_done,       width: 1 }
  - { signal: bist_pass,       width: 1 }
  - { signal: bist_fail,       width: 1 }
  - { signal: write_idle,      width: 1 }
  - { signal: read_idle,       width: 1 }
  - { signal: reserved,        width: 25 }
trigger:
  mode: value_match
  pretrigger: 512
  posttrigger: 3583
  conditions:
    - { signal: m_axis_valid, value: 1 }
