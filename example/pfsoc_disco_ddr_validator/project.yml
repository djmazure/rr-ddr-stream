# pfsoc_disco_ddr_validator — PolarFire SoC Discovery Kit DDR validator.
#
# HW validator for ddr_stream on the Microchip PolarFire SoC Discovery Kit
# (MPFS-DISCO-KIT, MPFS095T-1FCSG325E), driving MSS DDR4 over a Fabric Interface
# Controller (FIC0/FIC1) AXI4 target port — the PolarFire SoC sibling of the
# Xilinx/Altera ddr_validator examples.

project:
  name: rr_ddr_stream_pfsoc_disco_ddr_validator
  top_module: top_pfsoc_disco_ddr_validator

hardware:
  vendor: microchip
  # PolarFire SoC Discovery Kit (MPFS095T, FCSG325 package, DDR4 x16).
  part: "MPFS095T-1FCSG325E"
  language: vhdl
  family: "PolarFire SoC"
  platform: polarfire-soc-discovery
  platform_strict: true
  tool: libero
  tool_path: /opt/microchip/libero_soc/Libero_SoC
  tool_version: '2025.2'
  idcode: '0x0F8181CF'
  mss: mss/disco_mss.cxz
  pins: [ref_clk_50mhz]

auto_sources: true

paths:
  sources: [src, ../../rtl, ../../libs]

sources:
  sdc:
    - constraints/ddr_stream_cdc_scoped_microchip.sdc

packages:
  routertl/rea: "^1.0.0"
  open-logic/olo_base_fifo_sync:  {version: ^4.4.1, library: olo}
  open-logic/olo_base_fifo_async: {version: ^4.4.1, library: olo}
  open-logic/olo_base_wconv_n2xn: {version: ^4.4.1, library: olo}
  open-logic/olo_base_wconv_xn2n: {version: ^4.4.1, library: olo}

# RTL-P2.1273 advisory bring-up mode: VERIFYTIMING still runs/reports, but a
# negative timing verdict does not suppress programming-data generation.
timing:
  enforce: false

hooks:
  pre_build:
    - name: rr_rea_build_id
      script: routertl:sdk/scripts/rr_rea_build_id.py
      args:
        - "--ip-yml"
        - "libs/routertl/rea/ip.yml"
        - "--out"
        - "generated/rr_rea_build_id_pkg.vhd"
      watch:
        - "libs/routertl/rea/rtl/*.vhd"
        - "libs/routertl/rea/ip.yml"

tcl_hooks:
  gen_project:
    - tcl/pfsoc_mss_subsys.tcl

memory_map: sw/linux/system_memory_map.yml
linting:
  profile: esa-vhdl-baseline-provisional
