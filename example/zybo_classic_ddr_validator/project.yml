# zybo_classic_ddr_validator — declarative project descriptor.
#
# HW validator for ddr_stream_axi on the ORIGINAL Digilent Zybo (Classic,
# PB200-279, xc7z010clg400-1), driving real PS DDR3 through S_AXI_HP0.
# Pure-rr flow — NO build_project.tcl, NO hand-listed sources.syn, NO
# create_ip. See docs/DESIGN.md.
#
# Sibling of example/zybo_z7_20_ddr_validator (same IP, same in-fabric BIST,
# same record→flat HP0 shim). WHY a Classic sibling exists: the ring/HP0 path
# was NEVER validated on the xc7z010 part, and a sibling effort (IDP-T2.5,
# repo rr-idp) found ddr_stream_axi's write plane CORRUPTS DDR on the Classic
# (scattered, 64-bit-half-interleaved image) while the SAME IP works on the
# z020. This validator is the cleanest correctness check because it compares
# IN FABRIC and avoids the PS-readback path entirely.
#
# The block design (PS7 + interconnect + HP/GP wiring) is a generation RECIPE
# (tcl_hooks/gen_bd.tcl, RTL-P3.506), never a committed .bd.

project:
  name: rr_ddr_stream_zybo_classic_ddr_validator
  top_module: top_zybo_classic_ddr_validator

# Autodiscovery + dependency resolver feed the build directly. No explicit
# sources.syn list — the resolver walks paths.sources, parses entity/use
# clauses, and produces compile order. (No alpha glob; the resolver is the moat.)
auto_sources: true

hardware:
  vendor: xilinx
  part: "xc7z010clg400-1"
  language: vhdl
  # Canonical ORIGINAL-Zybo board preset (routertl/boards/zybo/ps7_preset.tcl,
  # auto-applied from this field). Provides PS7 PCW (DDR3 MT41K128M16 32-bit @
  # 525 MHz, FIXED_IO, 50 MHz PS_CLK crystal) and the board_pins .xdc. This is
  # the PB200-279 Rev B board — NOT the Z7-10/-20 (different crystal: 50 vs
  # 33.333 MHz; H.70 silkscreen-first board identity).
  platform: zybo
  # Project PS7 deltas applied AFTER the board preset (RTL-P2.618). The Classic
  # preset leaves the PL->PS fabric interrupt + IRQ_F2P enabled (this example
  # has no PL->PS IRQ → dangling input); turn them off. NB unlike the z020
  # preset, the Classic preset ships GP0/HP0 OFF — gen_bd.tcl enables them.
  ps7_hooks:
    - tcl_hooks/ps7_unused_off.tcl

# SELF-CONTAINED source tree (deepskopion model — NOT a ../../rtl cross-root
# glob). The example consumes the ddr_stream_axi IP and its olo FIFO deps as
# PACKAGES installed under ./libs. Why it matters: the IP's rr_fifo_async_mixed
# instantiates `entity olo.olo_base_wconv_n2xn`, so the olo sources MUST compile
# into Vivado library `olo`. The package manager records that mapping in ip.lock
# (library: olo / rr) and the resolver honours it. A raw `../../rtl` cross-root
# glob carries no such library metadata — olo then resolves to the default lib
# and synth dies with `[Synth 8-5826] no such design unit ... in library 'olo'`.
# So sources are just src/ (this example) + libs/ (installed packages).
paths:
  sources:
    - src
    - libs

# Packages (rr pkg). `local/ddr_stream_axi` is the IP under test, added with
#   rr pkg add --local ../.. --name ddr_stream_axi
# (vendored to libs/local/ddr_stream_axi, library rr). The open-logic/olo_*
# FIFO primitives are its transitive deps, pinned explicitly too — mirrors the
# IP's own ip.yml ips: list, the z020 sibling, and deepskopion's project.yml.
packages:
  open-logic/olo_base_fifo_sync: ^4.4.1
  open-logic/olo_base_fifo_async: ^4.4.1
  open-logic/olo_base_wconv_n2xn: ^4.4.1
  open-logic/olo_base_wconv_xn2n: ^4.4.1
  local/ddr_stream_axi: local
linting:
  profile: esa-vhdl-baseline-provisional

# NO hand-written constraint files (rr-board-pinout-first + the moat rules):
#   - LED pins (led[0..3] = M14/M15/G14/D18) are materialized into board_pins
#     .xdc from routertl/boards/zybo/pinout.yml by inferred pinout
#     subscription — the top's `led` port name matches the registry. Same
#     pattern as the z020 sibling + deepskopion. (M14/M15/G14/D18 are the same
#     LD0-LD3 pins on both the Classic and Z7-20 — bank 35.)
#   - The only fabric CDC (the IP's olo async FIFO + sync_cdc + base-addr) is
#     constrained by the IP ITSELF: ddr_stream_axi ships its proven scoped
#     RR--P3.8 set_max_delay via ip.yml build.sources.xdc, vendored here by
#     `rr pkg add --local` and applied as `read_xdc -ref ddr_stream_axi`
#     (RTL-P2.636). The project adds ZERO timing XDC.

# Block-design recipe — generates `ddr_validator_bd` (PS7 + proc_sys_reset +
# AXI interconnect, exposing M_AXI_GP0 + S_AXI_HP0 + FCLK0/1 + resets) at the
# routertl gen_project step. Never a committed .bd artifact. Both FCLKs at
# 100 MHz on the Classic (the small z010 ring tops out ~120 MHz; 100 closes).
tcl_hooks:
  gen_project:
    - tcl_hooks/gen_bd.tcl

# Embedded-Linux bring-up (full validator-app path) — OPTIONAL on the Classic.
# The PRIMARY verdict for this example is IN-FABRIC over JTAG (LED encoding +
# CSR readback via XSDB), which needs no Linux. The Linux path mirrors the
# z020 sibling for parity; `zybo` board recipe (same defconfig + dtsi family as
# vhdl-ethernet/example/zybo_rmii on the Classic).
linux:
  board: zybo
  boot_script: "sw/linux/boot.txt"
  uboot_repo: "https://github.com/Xilinx/u-boot-xlnx.git"
  kernel_repo: "https://github.com/Xilinx/linux-xlnx.git"
  fsbl_repo: "https://github.com/acostillado/embeddedsw.git"
  first_stage: xilinx-fsbl
  # mem=256M clamps kernel RAM to the low 256 MiB so the IP's DMA ring at
  # ddr_base 0x1000_0000 (256-512 MiB) is carved out of kernel RAM — the CPU
  # never caches/speculatively touches the ring. console=ttyPS0,115200 binds
  # /dev/console to the one enabled PS UART (Gate 4, zynq7-sd-boot-bringup).
  bootargs: "console=ttyPS0,115200 earlycon mem=256M"

  apps:
    - name: ddr_validator
      source: sw/linux/ddr_validator.c
      install: /usr/bin/ddr_validator

# Memory map consumed by `rr linux mmap` — the validator CSR window at
# 0x4000_0000 (must agree with assign_bd_address in tcl_hooks/gen_bd.tcl).
memory_map: sw/linux/system_memory_map.yml
