# kv260_ddr_validator — declarative project descriptor.
#
# HW validator for ddr_stream_axi on the AMD Kria KV260 (Zynq UltraScale+
# MPSoC, xck26), driving real PS DDR4 through S_AXI_HP0_FPD. Pure-rr flow —
# NO build_project.tcl, NO hand-listed sources.syn, NO create_ip. See
# docs/DESIGN.md.
#
# KV260 sibling of ../zybo_z7_20_ddr_validator. The block design (zynq_ultra_ps_e
# + smartconnects + proc_sys_reset) is a generation RECIPE (tcl_hooks/gen_bd.tcl,
# RTL-P3.506) distilled from kv260_linux/tcl/hooks/kv260_ps_bd.tcl, never a
# committed .bd.

project:
  name: rr_ddr_stream_kv260_ddr_validator
  top_module: top_kv260_ddr_validator

# Autodiscovery + dependency resolver feed the build directly. No explicit
# sources.syn list — the resolver walks paths.sources, parses entity/use
# clauses, and produces compile order. (No alpha glob; the resolver is the moat.)
auto_sources: true

hardware:
  vendor: xilinx
  part: "xck26-sfvc784-2LV-c"
  language: vhdl
  # Canonical AMD K26/KV260 board preset (routertl/boards/kv260/, vendored from
  # the official AMD board file). Resolved from this field and exposed to the BD
  # hook as $g_board_dir; the hook sources vivado-board/1.4/ps_preset.tcl for
  # the authoritative DDR4 / MIO / clock psu_init. Flip to retarget.
  platform: kv260
  # NOTE: unlike the Zynq-7 examples there is NO ps7_hooks list. ZynqMP PS
  # deltas (enable S_AXI_HP0_FPD + M_AXI_HPM0_FPD, eMMC re-add) are expressed
  # directly in tcl_hooks/gen_bd.tcl, which owns the zynq_ultra_ps_e cell.

# SELF-CONTAINED source tree (deepskopion / z7_20 model — NOT a ../../rtl
# cross-root glob). The example consumes the ddr_stream_axi IP and its olo FIFO
# deps as PACKAGES installed under ./libs. Why it matters: the IP's
# rr_fifo_async_mixed instantiates `entity olo.olo_base_wconv_n2xn`, so the olo
# sources MUST compile into Vivado library `olo`. The package manager records
# that mapping in ip.lock (library: olo / rr) and the resolver honours it. A
# raw `../../rtl` cross-root glob carries no such library metadata — olo then
# resolves to the default lib and synth dies with `[Synth 8-5826] no such
# design unit ... in library 'olo'`. So sources are just src/ + libs/.
paths:
  sources:
    - src
    - libs

  libraries:
    rr:
      - libs/local/ddr_stream_axi/rtl/ddr_stream_pkg.vhd
      - libs/local/ddr_stream_axi/rtl/support/functions_pkg.vhd
# Packages (rr pkg). `local/ddr_stream_axi` is the IP under test (vendored to
# libs/local/ddr_stream_axi, library rr). The open-logic/olo_* FIFO primitives
# are its transitive deps, pinned explicitly too — mirrors the IP's own ip.yml
# ips: list and the z7_20 example.
packages:
  open-logic/olo_base_fifo_sync: ^4.4.1
  open-logic/olo_base_fifo_async: ^4.4.1
  open-logic/olo_base_wconv_n2xn: ^4.4.1
  open-logic/olo_base_wconv_xn2n: ^4.4.1
  local/ddr_stream_axi: local

linting:
  profile: esa-vhdl-baseline-provisional

# NO hand-written constraint files. On ZynqMP the DDR + MIO are PS-internal
# (the board preset binds them inside the BD), and the KV260 SOM exposes no
# user LEDs on PL pins — so the top is PORT-LESS and there is nothing to pin.
# The only fabric CDC (the IP's olo async FIFO + sync_cdc + base-addr) is
# constrained by the IP ITSELF (ddr_stream_axi ships its scoped set_max_delay
# via ip.yml build.sources.xdc, vendored here and applied as
# `read_xdc -ref ddr_stream_axi`). The project adds ZERO timing XDC.

# Block-design recipe — generates `ddr_validator_bd` (zynq_ultra_ps_e + 2×
# smartconnect + proc_sys_reset, exposing S_AXI_HP0 + M_AXI_GP0 + fab_clk/
# fab_aresetn) at the routertl gen_project step. Never a committed .bd artifact.
tcl_hooks:
  gen_project:
    - tcl_hooks/gen_bd.tcl

# Embedded-Linux bring-up (full validator-app path). XSA sourced natively from
# the freshly built impl DCP via `rr linux xsa --refresh`. ZynqMP/aarch64 boot
# chain (fsbl + pmufw + bl31/ATF + u-boot → BOOT.bin) — see the
# zynqmp-kria-linux-bringup recipe and docs/BRING_UP.md. NB the KV260 Linux
# bring-up is the bench-flaky path; the primary autonomous verdict is the
# in-fabric BIST auto-run read over the CSR (JTAG `mrd 0xA0000004`).
linux:
  board: kv260
  # mem clamp carves the IP's DMA ring (ddr_base 0x7000_0000, 16 MiB) out of
  # kernel RAM so the APU never caches/speculatively touches the in-fabric ring.
  # The in-fabric compare means the CPU is never a producer/consumer of the
  # payload — it must only leave the ring's physical DDR alone. See
  # docs/BRING_UP.md.
  bootargs: "earlycon clk_ignore_unused mem=1792M"

  # Userspace app cross-compiled (aarch64) into the rootfs by `rr linux rootfs`.
  apps:
    - name: ddr_validator
      source: sw/linux/ddr_validator.c
      install: /usr/bin/ddr_validator

# Memory map consumed by `rr linux mmap` — the validator CSR window at
# 0xA000_0000 (must agree with assign_bd_address in tcl_hooks/gen_bd.tcl and
# the CSR's 12-bit decode).
memory_map: sw/linux/system_memory_map.yml
