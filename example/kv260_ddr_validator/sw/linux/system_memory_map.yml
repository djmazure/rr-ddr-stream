# Linux memory map for the KV260 ddr_stream_axi validator.
#
# Scaffolded for `rr linux mmap` / `rr linux sync`. SINGLE SOURCE OF TRUTH for
# AXI memory-mapped IPs in the PL. `rr linux mmap` reads it and patches the
# block design's address segments to match (must agree with the
# assign_bd_address call in tcl_hooks/gen_bd.tcl). `rr linux sync` reads it
# after XSA export and regenerates the device tree + UIO C/Python headers.
#
# NOTE: only the CSR (AXI-Lite control/status, M_AXI_GP0 → M_AXI_HPM0_FPD) is a
# PS-visible memory-mapped device. The IP's DMA ring lives in PS DDR4
# (S_AXI_HP0_FPD) at the physical window ddr_base 0x7000_0000; that region is
# NOT a device — it is DDR carved out of the kernel via the `mem=` boot clamp
# (see docs/BRING_UP.md). The validator compares IN FABRIC, so userspace never
# maps the ring.

version: "1.0.0"
# AMD Kria K26 SOM / KV260 — Zynq UltraScale+ MPSoC (xck26-sfvc784), aarch64.
# Selects the aarch64 cross-toolchain + xilinx_zynqmp_* defconfigs in the rr
# linux flow.
target: zynqmp

devices:
  # ddr_validator_csr — AXI4-Lite slave on the PS M_AXI_HPM0_FPD master. The
  # userspace validator app (ddr_validator.c) mmaps this window via /dev/mem
  # (O_SYNC, uncached) to drive scenarios and read the pass/fail verdict.
  - name: ddr_validator_csr
    base_addr: 0xA0000000
    size:      0x10000        # 64 KiB CSR window (the CSR decodes the low 4 KiB)
    # No `compatible` — this CSR has no mainline driver; userspace reaches it
    # via /dev/mem. (A UIO node could be added later for a uio_pdrv_genirq
    # binding, but the validator app deliberately uses /dev/mem for zero driver
    # dependencies on a minimal rootfs.)
    uio_index: 0
