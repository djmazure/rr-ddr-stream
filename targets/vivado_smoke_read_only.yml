# Synthesis smoke target — read-only plane configuration.
#
# DDR-P1.1 (2026-05-18): paired with targets/vivado_smoke.yml and
# vivado_smoke_write_only.yml as the regression for the plane-elision
# generics. enable_write_plane_g=false elides the entire ingress path
# (skid_in / uploader / axi4w / sync_cdc_up_busy).
#
# Use:
#   rr target set vivado_smoke_read_only && rr synth run
#
# Pass criteria (vs vivado_smoke baseline):
#   - Synthesis completes; no CRITICAL WARNINGs.
#   - s_axis_ready_o / s_axis_* / AW* / W* / BREADY tied to constants.
#   - Utilisation report shows lower LUT / FF / BRAM than the both-
#     planes baseline.

project:
  name: rr_ddr_stream_vivado_smoke_read_only
  top_module: ddr_stream_axi
  output_dir: out/vivado_smoke_read_only

hardware:
  vendor: xilinx
  part: xc7z020clg400-1
  language: vhdl
  platform: default

build_options:
  tool_version: "2024.1"
  generics:
    user_data_width_g: 32
    ddr_data_width_g:  512
    enable_write_plane_g: false
    enable_read_plane_g:  true

sources:
  syn:
    - rtl/ddr_stream_pkg.vhd
    - rtl/support/functions_pkg.vhd
    - rtl/support/ddr_sync_cdc.vhd
    - rtl/support/skid_buffer.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_array.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_math.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_logic.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_string.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_attribute.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_cc_bits.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_cc_reset.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_ram_sdp.vhd
    - libs/open-logic/olo_base_fifo_sync/src/base/vhdl/olo_base_fifo_sync.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_fifo_async.vhd
    - libs/open-logic/olo_base_wconv_n2xn/src/base/vhdl/olo_base_wconv_n2xn.vhd
    - libs/open-logic/olo_base_wconv_xn2n/src/base/vhdl/olo_base_wconv_xn2n.vhd
    - rtl/support/xilinx/rr_fifo_sync_xpm_body.vhd
    - rtl/support/xilinx/rr_fifo_async_mixed_xpm_body.vhd
    - rtl/support/rr_fifo_sync.vhd
    - rtl/support/rr_fifo_async_mixed.vhd
    - rtl/ddr_fifo_intf.vhd
    - rtl/ptr_mgr.vhd
    - rtl/burstw_setter.vhd
    - rtl/burstr_setter.vhd
    - rtl/axi4w.vhd
    - rtl/axi4r.vhd
    - rtl/downloader.vhd
    - rtl/uploader.vhd
    - rtl/ddr_stream_axi.vhd

paths:
  sources:
    - rtl
    - libs
