# DE25-Standard (Agilex 5) synth-smoke target — Quartus Prime PRO / ddr_stream_avmm TOP.
#
# Phase-0/1 scaffold for the TerASIC DE25-Standard bring-up (Agilex 5 SoC,
# A5ED013BB32AE4SCS). This is the Agilex-5 sibling of targets/quartus_smoke.yml
# (Arria 10 / Std): same AVMM datapath (ddr_stream_avmm — the Phase-2 DE25
# datapath), same xpm-free source list (Quartus rejects `library xpm` at analyse
# time), retargeted to Agilex 5 on the Quartus Prime PRO install.
#
# What this scaffold proves (synth-only — no board pins / SDC / bitstream yet):
#   - the Quartus Prime Pro 25.3.1 toolchain at /opt/altera_pro/25.3 drives `rr`
#   - Agilex 5 (A5ED013BB32AE4SCS) is recognised + synthesises the AVMM datapath
#   - Agilex 5 license entitlement resolves at compile (base-tool / AUTH;
#     get_family_list is EMPTY → exercises the RTL-P3.663 empty-list→warn→proceed
#     branch on real silicon, which the Arria-10 per-family license never hit)
#
# Use:
#   rr target set de25_agilex5_smoke && rr synth run
#
# Board: DE25-Standard. DDR4 = 1 GB / 32-bit / no-ECC / DDR4-2400, 150 MHz refclk
# (U17), driven from the HPS (control plane). Pinout/refclk/part facts are
# reference-only from the DE25 System CD golden_top GHRD — NEVER copy its project
# structure (PetaLinux/vendor-TCL flow is the thing rr replaces). Board-pinout
# registry + SDC + bitstream land in the next phase; this gate is synth-only.

project:
  name: rr_ddr_stream_de25_agilex5
  top_module: ddr_stream_avmm
  output_dir: out/de25_agilex5_smoke

hardware:
  vendor: altera
  part: "A5ED013BB32AE4SCS"   # matches the revD golden_top.qsf + boards/de25-standard (was SR1 — Phase-0 note; manual cites both, SCS is authoritative). Same density → synth footprint unchanged.
  language: vhdl
  platform: default
  family: "Agilex 5"
  edition: pro
  tool_path: /opt/altera_pro/25.3

build_options:
  tool_version: "25.3"
  # RR--P3.6: synth-verify the 32/512 width combo on Quartus.
  generics:
    user_data_width_g: 32
    ddr_data_width_g:  512

# Explicit source list — RR--P3.3 xpm_body files INTENTIONALLY OMITTED.
# Quartus rejects `library xpm; use xpm.vcomponents.all;` at analyse
# time even when the entity is never instantiated. fifo_impl_g="olo"
# (the rr_fifo_* wrappers' default) keeps the GEN_XPM branch pruned;
# the matching `entity work.<name>_xpm_body` reference resolves at
# elab time only when fifo_impl_g="xpm" is selected (which this
# target never does).
sources:
  # `syn:` lists ALL compiled sources (this is what gets emitted as VHDL_FILE).
  # The `libraries:` block below does NOT add sources — it only annotates which
  # library a file compiles into (written to .routertl_cache/libraries.json,
  # consumed by gen_project's per-file -library lookup). So each rtl/ unit must
  # appear in BOTH `syn:` (to be a source) and `libraries.rr:` (to land in
  # `-library rr`, which strict Quartus Pro / quartus_syn requires) — the standard
  # `sources.libraries:` pattern. Listed once each here; no duplicate emission on
  # a clean project dir.
  syn:
    - rtl/ddr_stream_pkg.vhd
    - rtl/support/functions_pkg.vhd
    - rtl/support/ddr_sync_cdc.vhd
    - rtl/support/skid_buffer.vhd
    - rtl/support/intel/rr_fifo_sync_xpm_body_stub.vhd
    - rtl/support/intel/rr_fifo_async_mixed_xpm_body_stub.vhd
    - rtl/support/rr_fifo_sync.vhd
    - rtl/support/rr_fifo_async_mixed.vhd
    - rtl/ddr_fifo_intf.vhd
    - rtl/ptr_mgr.vhd
    - rtl/burstw_setter.vhd
    - rtl/burstr_setter.vhd
    - rtl/avmm/avmm_w.vhd
    - rtl/avmm/avmm_r.vhd
    - rtl/avmm/uploader_avmm.vhd
    - rtl/avmm/downloader_avmm.vhd
    - rtl/ddr_stream_avmm.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_array.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_math.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_logic.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_string.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_pkg_attribute.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_cc_bits.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_cc_reset.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_ram_sdp.vhd
    - libs/open-logic/olo_base_fifo_sync/src/base/vhdl/olo_base_fifo_sync.vhd
    - libs/open-logic/olo_base_fifo_async/src/base/vhdl/olo_base_fifo_async.vhd
    - libs/open-logic/olo_base_wconv_n2xn/src/base/vhdl/olo_base_wconv_n2xn.vhd
    - libs/open-logic/olo_base_wconv_xn2n/src/base/vhdl/olo_base_wconv_xn2n.vhd
# Named-library mapping: the rtl/ units declare `library rr; use rr.<unit>`, so
# they must compile into library `rr`, not the default `work`. This block does NOT
# add sources (they are listed in `syn:` above) — it only annotates their library
# (written to .routertl_cache/libraries.json, used by gen_project's per-file
# -library lookup). Quartus Std (quartus_map) tolerates rtl-in-`work`, but Quartus
# Pro (quartus_syn / DNI, Agilex 5) is strict: without `-library rr` A&S fails
# `Error (13785): design library "rr" does not contain primary unit ...`. With this
# mapping the .qsf carries `-library rr` and Pro A&S passes. (Same file in `syn:`
# AND here = listed once each; emitted once with `-library rr` on a clean dir.)
  libraries:
    rr:
      - rtl/ddr_stream_pkg.vhd
      - rtl/support/functions_pkg.vhd
      - rtl/support/ddr_sync_cdc.vhd
      - rtl/support/skid_buffer.vhd
      - rtl/support/intel/rr_fifo_sync_xpm_body_stub.vhd
      - rtl/support/intel/rr_fifo_async_mixed_xpm_body_stub.vhd
      - rtl/support/rr_fifo_sync.vhd
      - rtl/support/rr_fifo_async_mixed.vhd
      - rtl/ddr_fifo_intf.vhd
      - rtl/ptr_mgr.vhd
      - rtl/burstw_setter.vhd
      - rtl/burstr_setter.vhd
      - rtl/avmm/avmm_w.vhd
      - rtl/avmm/avmm_r.vhd
      - rtl/avmm/uploader_avmm.vhd
      - rtl/avmm/downloader_avmm.vhd
      - rtl/ddr_stream_avmm.vhd

# Fully-explicit target: no `paths.sources` autodiscovery — every source is named
# in `syn:` above and library-mapped in `libraries.rr:`. SEARCH_PATH is still
# derived from the listed source files' directories by gen_project. (Autodiscovery
# is fine too, but kept off here to match the deterministic quartus_smoke style.)
#
# NOTE if you re-run after editing this target: `rr synth run` does NOT clear the
# generated .qsf, so library re-assignments can ACCUMULATE stale `-library work`
# entries across edits → `Error (16169): ambiguous entity binding`. Nuke the
# output dir (`rm -rf out/de25_agilex5_smoke`) before re-synth when changing the
# source/library layout. (Observed during bring-up; not a routertl defect.)
